services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: hotel_platform, POSTGRES_USER: hotel, POSTGRES_PASSWORD: hotel}
    volumes: [hotel_postgres:/var/lib/postgresql/data]
    ports: ["5433:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U hotel -d hotel_platform"], interval: 5s, timeout: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [hotel_redis:/data]
  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py seed_hotel && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --reload"
    environment: {DJANGO_SECRET_KEY: local-development-secret, DJANGO_DEBUG: "true", DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend", DATABASE_URL: "postgresql://hotel:hotel@db:5432/hotel_platform", REDIS_URL: "redis://redis:6379/0", FRONTEND_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173", CSRF_TRUSTED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173", BOOTSTRAP_ADMIN_EMAIL: "owner@hotel.local", BOOTSTRAP_ADMIN_PASSWORD: "LocalHotel123!"}
    volumes: [./backend:/app]
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_started}}
  celery:
    build: ./backend
    command: celery -A config worker -l info
    environment: {DJANGO_SECRET_KEY: local-development-secret, DATABASE_URL: "postgresql://hotel:hotel@db:5432/hotel_platform", REDIS_URL: "redis://redis:6379/0"}
    volumes: [./backend:/app]
    depends_on: [db,redis]
  beat:
    build: ./backend
    command: celery -A config beat -l info
    environment: {DJANGO_SECRET_KEY: local-development-secret, DATABASE_URL: "postgresql://hotel:hotel@db:5432/hotel_platform", REDIS_URL: "redis://redis:6379/0"}
    volumes: [./backend:/app]
    depends_on: [db,redis]
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev --host 0.0.0.0"
    environment: {CI: "true", VITE_API_BASE_URL: "http://localhost:8000/api", VITE_GRAPHQL_URL: "http://localhost:8000/graphql/"}
    volumes: [./frontend:/app, hotel_frontend_node_modules:/app/node_modules]
    ports: ["5173:5173"]
    depends_on: [backend]
volumes: {hotel_postgres: {}, hotel_redis: {}, hotel_frontend_node_modules: {}}
